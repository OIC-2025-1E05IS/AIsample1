name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AIsample1.sln
      - name: Build
        run: dotnet build AIsample1.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test AIsample1.sln --configuration Release --no-build
